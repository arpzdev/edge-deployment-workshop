server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  error_page 404 /404.html;
  location / { try_files $uri $uri/ =404; }
  # Local stand-in for the edge function so the page doesn't error inside Docker
  location = /api/edge {
    default_type application/json;
    return 200 '{"colo":"docker-localhost","city":"your laptop","country":"--","ms":0}';
  }
}
